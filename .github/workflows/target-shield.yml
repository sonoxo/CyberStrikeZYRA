name: target-shield

on:
  push:
    paths:
      - "packages/target-defense/**"
      - ".github/workflows/target-shield.yml"
  pull_request:
    paths:
      - "packages/target-defense/**"
      - ".github/workflows/target-shield.yml"

permissions:
  contents: read

jobs:
  node-smoke:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Node launcher smoke test
        run: |
          node --version
          node packages/target-defense/target-shield.mjs init --db /tmp/target-shield.json
          node packages/target-defense/target-shield.mjs add test-lab --name test-lab --kind domain --locator lab.example.internal --owner cyberstrike --env lab --db /tmp/target-shield.json
          node packages/target-defense/target-shield.mjs authorize test-lab --approved-by ci --reason "defensive CI validation" --scope lab.example.internal --hours 1 --db /tmp/target-shield.json
          node packages/target-defense/target-shield.mjs check test-lab --action scan --db /tmp/target-shield.json
          node packages/target-defense/target-shield.mjs scope test-lab --db /tmp/target-shield.json

  policy:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - uses: ./.github/actions/setup-bun

      - name: Install workspace dependencies
        run: bun install --frozen-lockfile

      - name: Run Target Shield policy tests
        run: bun --cwd packages/target-defense test
