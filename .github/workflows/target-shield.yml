name: target-shield

on:
  push:
    paths:
      - "packages/target-defense/**"
      - ".github/workflows/target-shield.yml"
  pull_request:
    paths:
      - "packages/target-defense/**"
      - ".github/workflows/target-shield.yml"

permissions:
  contents: read

jobs:
  policy:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - uses: ./.github/actions/setup-bun

      - name: Install workspace dependencies
        run: bun install --frozen-lockfile

      - name: Run Target Shield policy tests
        run: bun --cwd packages/target-defense test
