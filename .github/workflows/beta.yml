name: beta

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

jobs:
  sync:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Setup Git Committer
        id: setup-git-committer
        continue-on-error: true
        uses: ./.github/actions/setup-git-committer
        with:
          cyberstrike-app-id: ${{ vars.CYBERSTRIKE_APP_ID }}
          cyberstrike-app-secret: ${{ secrets.CYBERSTRIKE_APP_SECRET }}

      - name: Fallback git config
        if: steps.setup-git-committer.outcome == 'failure'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Select sync token
        env:
          APP_TOKEN: ${{ steps.setup-git-committer.outputs.token }}
          FALLBACK_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ steps.setup-git-committer.outcome }}" = "success" ]; then
            echo "GH_TOKEN=$APP_TOKEN" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "GH_TOKEN=$FALLBACK_TOKEN" >> "$GITHUB_ENV"

      - name: Sync beta branch
        run: bun script/beta.ts
